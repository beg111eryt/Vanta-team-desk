name: Build and publish Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: valorant-team-desk/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: valorant-team-desk

      - name: Build Windows installer
        run: npm run dist
        working-directory: valorant-team-desk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: valorant-team-desk/release/VANTA-Team-Desk-Setup.exe
